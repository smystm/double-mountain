<!DOCTYPE html>
<html lang="FA-iran">
   <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Begin::Owl-Js assets -->
      <link rel="stylesheet" href="./assets/css/owl.carousel.min.css" />

      <link rel="stylesheet" href="assets/css/fontiran.css" />
      <link rel="stylesheet" href="assets/css/style.css" />
      <title>دو کوهه - آموزش به سبک جدید</title>
   </head>

   <body dir="rtl" class="font-[dana] overflow-x-hidden bg-[#F3F4F6] dark:bg-[#111827] dark:text-white">
      <div class="container-main min-h-[100vh]">
         <!-- Content-Body -->
      </div>
      <!--Begin::Popup-cart-->
      <div class="popup-cart absolute left-[50%] top-[50%] transform-fix w-3/4 sm:w-2/3 lg:w-[700px] mt-10">
          <!--Begin::popup-secFirst-->
          <div class="popup-secfirst rounded-[50px] bg-white dark:bg-[#ffffff09]">
             <!--Begin::head-cart-->
             <div class="head-cart flex justify-between bg-[#257E6C] rounded-t-[20px] sm:rounded-t-[30px] xl:rounded-t-[50px] px-4 sm:px-7 pt-4 pb-2 xl:pb-5 xl:pt-7">
                <h2 class="text-[12px] sm:text-[16px] xl:text-[20px] font-semibold">بستن</h2>
                <span class="text-[12px] sm:text-[18px] xl:text-[24px] font-medium">دوره به سبد خرید شما اضافه شد</span>
             </div>
             <!--End::head-cart-->
             <!--Begin::content-->
             <div class="content">
                 <!--Begin::content-cart-->
                 <div class="content-cart flex flex-col px-3 sm:px-4 xl:px-5">
                    <!--Begin::cart-->
                    <div class="carts flex items-center py-3">
                       <div class="cart-box">
                          <div class="flex flex-col md:flex-row justify-between items-center p-3 gap-3 text-[14px] xl:text-[16px] rounded-[15px]">
                             <div class="image-box object-cover rounded-[15px] my-1">
                                <img src="assets/img/courses-cover.png" alt="SEO" class="object-cover w-[100px] md:w-[65px] lg:w-[100px] rounded-[15px]" />
                             </div>
                             <div class="sub-information md:w-3/5">
                                <h4 class="title text-center md:text-start line-clamp-2 sm:text-[14px] lg:text-[18px]">
                                   حجاب و عفاف جایگاه حلقه‌‌های میانی در گسترش حجاب نقش و جایگاه حلقه‌‌های میانی در گسترش حجاب و عفاف
                                </h4>
                             </div>
                             <span class="text-[#189551] text-[14px] lg:text-[16px] text-left md:w-1/5">500,000 تومن</span>
                          </div>
                       </div>
                    </div>
                    <!--End::cart-->
                    <!--Begin::Btn-->
                    <div class="flex justify-center items-center py-3 mb-4 lg:mb-7">    
                        <a class="bg-[#257E6C] no-underline text-white text-sm rounded-[20px] flex items-center px-10 py-2 lg:py-4 sm:px-20 md:px-32 text-[14px] sm:text-[18px] xl:text-[24px]" href="#">
                        برو به سبد خرید
                        </a>
                    </div>
                    <!--End::Btn-->
                 </div>
                 <!--End::content-cart-->
             </div>
             <!--Begin::content-->
          </div>
          <!--End::popup-secFirst-->
      </div>
      <!--End::Popup-cart-->
      <!--Begin::Owl-Js -->
      <script src="./assets/js/jquery.min.js"></script>
      <script src="./assets/js/owl.carousel.min.js"></script>
      <script src="./assets/js/app.js"></script>
      <!-- End::Owl-Js-->
